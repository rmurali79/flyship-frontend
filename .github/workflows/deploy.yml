name: Deploy

# The real end-to-end build + deploy. Only runs on main, which only ever
# moves forward via a human-reviewed, approved pull request (branch
# protection) — that PR review is the validation gate for this deploy.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy frontend to Cloud Run
        run: ./scripts/deploy_frontend.sh
